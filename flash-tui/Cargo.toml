[package]
name = "flash-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
crossterm = "0.28.1"
flash-async = { version = "0.1.0", path = "../flash-async" }
flash-singlethreaded = { version = "0.1.0", path = "../flash-singlethreaded" }
flashlib = { version = "0.1.0", path = "../flashlib" }
ratatui = "0.30.0"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["registry", "std"] }
